<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a1c"/>
      <stop offset=".5" stop-color="#16204a"/>
      <stop offset=".82" stop-color="#3a3466"/>
      <stop offset="1" stop-color="#5b4470"/>
    </linearGradient>
    <radialGradient id="milky" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e8dcff" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#a99ae0" stop-opacity=".14"/>
      <stop offset="1" stop-color="#a99ae0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="300" cy="190" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6dc" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </radialGradient>
    <!-- 三層不同週期的星點圖樣，疊起來看不出重複 -->
    <pattern id="s1" width="230" height="210" patternUnits="userSpaceOnUse" fill="#fff">
      <circle cx="12" cy="20" r="1" opacity=".8"/><circle cx="80" cy="64" r=".8" opacity=".6"/><circle cx="150" cy="18" r="1.2" opacity=".9"/>
      <circle cx="200" cy="120" r=".9" opacity=".7"/><circle cx="40" cy="150" r="1.1" opacity=".8"/><circle cx="120" cy="190" r=".8" opacity=".5"/>
      <circle cx="176" cy="80" r=".7" opacity=".6"/><circle cx="98" cy="128" r="1" opacity=".75"/>
    </pattern>
    <pattern id="s2" width="370" height="330" patternUnits="userSpaceOnUse" fill="#fff">
      <circle cx="60" cy="90" r="1.5" opacity=".9"/><circle cx="250" cy="40" r="1.3" opacity=".85"/><circle cx="320" cy="240" r="1.6" opacity=".9"/>
      <circle cx="140" cy="280" r="1.2" opacity=".7"/><circle cx="200" cy="170" r=".9" opacity=".6"/>
    </pattern>
    <pattern id="s3" width="610" height="470" patternUnits="userSpaceOnUse">
      <circle cx="120" cy="110" r="6" fill="#dfe6ff" opacity=".18"/><circle cx="120" cy="110" r="2" fill="#fff"/>
      <circle cx="470" cy="330" r="7" fill="#ffe9c9" opacity=".16"/><circle cx="470" cy="330" r="2.2" fill="#fff"/>
      <circle cx="380" cy="60" r="5" fill="#cfe0ff" opacity=".18"/><circle cx="380" cy="60" r="1.7" fill="#fff"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="900" cy="380" rx="900" ry="190" fill="url(#milky)" transform="rotate(-22 900 380)"/>
  <ellipse cx="960" cy="360" rx="520" ry="80" fill="url(#milky)" transform="rotate(-22 960 360)"/>
  <rect width="1600" height="820" fill="url(#s1)"/>
  <rect width="1600" height="820" fill="url(#s2)"/>
  <rect width="1600" height="820" fill="url(#s3)"/>

  <rect width="1600" height="1000" fill="url(#moonGlow)"/>
  <circle cx="300" cy="190" r="40" fill="#fbf3dc"/>
  <circle cx="318" cy="178" r="40" fill="#0d1430" opacity=".9"/>

  <!-- 流星 -->
  <path d="M1180 140L1330 90" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>

  <!-- 山稜線 -->
  <path fill="#1c1d42" d="M0 820C140 760 260 700 380 730S560 800 700 760 900 660 1040 700 1260 790 1400 750 1560 700 1600 710V1000H0Z"/>
  <path fill="#0b0c22" d="M0 900C160 860 300 820 460 850S720 930 900 890 1220 820 1400 860 1560 900 1600 890V1000H0Z"/>
</svg>
