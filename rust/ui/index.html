<template id="help-page">
<header class="page-head"><div><h1>使用說明</h1><p class="muted">找到你想做的事，照著步驟做就可以</p></div></header>
<section class="card help">
  <div class="toc">
    <a class="tag" href="#help-start">第一次使用</a><a class="tag" href="#help-sale">賣東西</a>

<section class="card help" id="help-start">
  <h2>第一次使用</h2>
  <ol>
    <li>到「<a href="#/suppliers">廠商</a>」新增常往來的廠商。</li>
    <li>到「<a href="#/specs">顏色與尺寸</a>」看看缺不缺顏色或尺寸（已內建 12 色、8 種尺寸）。</li>
    <li>店裡已經有貨：到「<a href="#/adjust">庫存調整</a>」選<b>期初庫存</b>，把現有的數量和成本輸入進去。</li>
    <li>有舊的 Excel 銷貨單：到「<a href="#/history">歷史銷貨</a>」匯入（可跳過）。</li>
  </ol>
  <p class="tip">之後每天打開「<a href="#/home">首頁</a>」，看今天賣了多少、哪些貨快沒了，以及資料檢查是不是都綠燈。</p>
</section>

<section class="card help" id="help-sale">
  <h2>賣東西</h2>
  <ol>
    <li>打開「<a href="#/sale">銷貨收銀</a>」。</li>
    <li>在搜尋框輸入貨號或品名，按 <kbd>Enter</kbd>。</li>
    <li>跳出顏色 × 尺寸表格，在要賣的格子填數量，按<b>加入明細</b>。</li>
    <li>要打折就改單價，或在下方填<b>整單折扣</b>。</li>
    <li>按<b>結帳</b>，確認金額後就完成了。</li>
  </ol>
  <p class="tip">輸入完整 SKU（例 <kbd>4B7A695A9-BK-M</kbd>）會直接加一件，再輸入一次就變兩件。</p>
  <details><summary>要加營業稅、填客戶資料或印出貨單？</summary>
    <ul>
      <li><b>課稅別</b>選「應稅」會自動加 5% 營業稅；「零稅率」「免稅」不加稅。</li>
      <li>展開<b>客戶資料</b>可以填名稱、電話、地址（不填也可以）。</li>
      <li>出貨單：到「<a href="#/docs">單據查詢</a>」點開這張銷貨單，按<b>匯出銷貨單 Excel</b>。</li>
      <li>報表上的營業額、毛利都是<b>未稅</b>金額。</li>
    </ul>
  </details>
</section>

<section class="card help" id="help-return">
  <h2>客人退貨</h2>
  <ol>
    <li>一樣打開「<a href="#/sale">銷貨收銀</a>」，找到要退的商品。</li>
    <li>數量填<b>負數</b>，例如 <kbd>-1</kbd>。</li>
    <li>按<b>結帳</b>。庫存會加回去，金額顯示負數（要退給客人的錢）。</li>
  </ol>
</section>

<section class="card help" id="help-purchase">
  <h2>貨到了（進貨）</h2>
  <ol>
    <li>打開「<a href="#/purchase">進貨</a>」，選廠商（沒有就按<b>＋ 新增廠商</b>）。</li>
    <li>舊款：輸入貨號或品名找出來。新款：按<b>＋ 新商品建檔</b>。</li>
    <li>在顏色 × 尺寸表格填數量和<b>進貨單價</b>，按<b>加入明細</b>。</li>
    <li>按<b>存檔進貨</b>，庫存就會增加。</li>
  </ol>
  <p class="tip">可以按「選擇照片」附上廠商貨單，方便日後對帳。忘了登記的舊貨單，日期選當天的日期補登即可，成本會自動重算。</p>
</section>

<section class="card help" id="help-lookup">
  <h2>查庫存、尺寸</h2>
  <ol>
    <li>打開「<a href="#/lookup">查庫存</a>」，輸入貨號、SKU 或品名。</li>
    <li>會看到每個顏色、尺寸還剩幾件。<b>紅字</b>是快沒貨了，<b>灰字</b>是沒貨。</li>
    <li>有填尺寸表的商品，下方會列出胸圍、腰圍等，方便回答客人。</li>
  </ol>
</section>

<section class="card help" id="help-product">
  <h2>新增商品、填尺寸表</h2>
  <ol>
    <li>打開「<a href="#/products">商品</a>」，按<b>＋ 新增商品</b>，填品名、售價等資料後存檔。</li>
    <li>勾選這款有的顏色和尺寸，系統會自動產生每一個 SKU。</li>
    <li>想在庫存太少時被提醒，就在 SKU 的<b>安全庫存</b>填數字（填 0 表示不提醒）。</li>
    <li>頁面最下方的<b>尺寸表</b>可填各尺寸的胸圍、腰圍、臀圍、衣長（公分，可填範圍如 <kbd>96-100</kbd>）。
      項目可以改名、按 × 刪除，或按<b>＋ 加量測項目</b>新增，填完按<b>儲存尺寸表</b>。</li>
  </ol>
  <p class="tip">已經進過貨或賣過的商品不能刪除，以免報表對不起來。</p>
  <details><summary>貨號和 SKU 是怎麼來的？</summary>
    <ul>
      <li><b>本店貨號</b>：建檔時自動產生，例如 <kbd>4B7A695A9</kbd>，之後不能改。</li>
      <li><b>SKU</b>：貨號-顏色-尺寸，例如 <kbd>4B7A695A9-BK-M</kbd> 是黑色 M 號。</li>
    </ul>
  </details>
</section>

<section class="card help" id="help-adjust">
  <h2>盤點、報廢</h2>
  <p>打開「<a href="#/adjust">庫存調整</a>」，選擇類型，填好原因後存檔：</p>
  <ul>
    <li><b>盤點調整</b>：填實際點到的數量，系統會自己算差幾件。</li>
    <li><b>瑕疵報廢</b>、<b>退回廠商</b>：填少了幾件（填正數）。</li>
    <li><b>期初庫存</b>：剛開始用系統時，輸入店裡原有的數量和成本。</li>
    <li><b>其他</b>：增加填正數，減少填負數。</li>
  </ul>
</section>

<section class="card help" id="help-docs">
  <h2>單據打錯了</h2>
  <ol>
    <li>打開「<a href="#/docs">單據查詢</a>」，點開打錯的那張。</li>
    <li>按<b>作廢這張單據</b>，填寫原因。</li>
    <li>重新開一張正確的。</li>
  </ol>
  <p class="tip">存好的單據不能修改或刪除，只能作廢，這樣帳才查得清楚。作廢後庫存和成本會自動重算。</p>
</section>

<section class="card help" id="help-history">
  <h2>匯入舊的 Excel 銷貨單</h2>
  <ol>
    <li>打開「<a href="#/history">歷史銷貨</a>」，按<b>匯入 Excel 銷貨單</b>，可一次選多個檔案。</li>
    <li>系統會讀出日期、品名、數量、金額和客戶資料；同一個貨單編號只會匯入一次。</li>
  </ol>
  <p class="tip">舊銷貨單只當作紀錄，<b>不會扣庫存</b>，會出現在「月營業額」報表。匯錯了可以點開後刪除。</p>
</section>

<section class="card help" id="help-report">
  <h2>看報表</h2>
  <p>打開「<a href="#/reports">報表</a>」，選報表和日期，每張都能<b>匯出 Excel</b>。</p>
  <dl>
    <dt>即時庫存表</dt><dd>每個 SKU 剩幾件、值多少錢。</dd>
    <dt>進貨／銷貨報表</dt><dd>一段期間內每一筆進貨、銷貨，銷貨還會算毛利。</dd>
    <dt>季度收益</dt><dd>每一季賺多少、毛利率多少、要繳多少營業稅。</dd>
    <dt>月營業額</dt><dd>每個月賣了多少，包含匯入的舊銷貨單。</dd>
    <dt>滯銷品</dt><dd>很久沒賣出去、但還有庫存的商品。</dd>
    <dt>熱銷排行</dt><dd>賣最好的前 50 名。</dd>
  </dl>
  <details><summary>成本怎麼算？</summary>
    <p>用<b>平均成本</b>：每次進貨後，把舊庫存和新進的貨一起平均。例如原本 10 件每件 200 元，再進 10 件每件 300 元，平均成本就是 250 元。賣出時就用這個成本算毛利。</p>
  </details>
</section>

<section class="card help" id="help-safe">
  <h2>資料備份</h2>
  <ul>
    <li>程式每天第一次開啟時會<b>自動備份</b>，保留最近 30 天。</li>
    <li>資料都在這台電腦上，首頁按<b>開啟資料夾</b>就看得到。更新或重裝程式不會刪掉資料。</li>
    <li>所有新增、修改、作廢都會記在「<a href="#/audit">操作紀錄</a>」。</li>
  </ul>
  <p class="tip">建議每週把整個資料夾複製到隨身碟或雲端硬碟一次，電腦壞了也不怕。</p>
  <details><summary>怎麼還原備份？</summary>
    <ol>
      <li>先關閉程式。</li>
      <li>到資料夾裡的 <kbd>備份</kbd>，找到想要的日期的檔案，複製出來。</li>
      <li>改名為 <kbd>庫存資料.sqlite3</kbd>，取代原本的同名檔案，再開啟程式。</li>
    </ol>
  </details>
</section>

<section class="card help" id="help-faq">
  <h2>常見問題</h2>
  <dl>
    <dt>存檔時出現紅色提示？</dt><dd>照提示的說明修正後再存一次就好，資料不會只存一半。</dd>
    <dt>說庫存不足，存不了？</dt><dd>通常是進貨還沒登記，先補登進貨再賣。</dd>
    <dt>找不到商品？</dt><dd>試著只打品名的一部分，或到「商品」頁用廠商貨號搜尋。</dd>
    <dt>首頁出現紅燈？</dt><dd>按<b>重新核算</b>，系統會依單據重算庫存與成本。</dd>
    <dt>畫面沒有更新？</dt><dd>點一下左側選單切換頁面再回來。</dd>
    <dt>換新電腦怎麼搬資料？</dt><dd>新電腦先安裝並開啟一次程式後關閉，再把舊電腦整個資料夾的內容複製到新電腦的相同位置。</dd>
  </dl>
</section>
