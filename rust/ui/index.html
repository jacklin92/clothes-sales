<template id="help-page">
<header class="page-head"><div><h1>使用說明</h1><p class="muted">第一次使用請從「快速開始」照著做一遍</p></div></header>
<section class="card help">
  <div class="toc">

<section class="card help" id="help-start">
  <h2>快速開始</h2>
  <ol>
    <li>到「<a href="#/suppliers">廠商</a>」新增常往來的廠商（代號、名稱即可）。</li>
    <li>到「<a href="#/specs">顏色與尺寸</a>」確認需要的顏色與尺寸；系統已預載 12 色、8 種尺寸。</li>
    <li>貨到時開「<a href="#/purchase">進貨</a>」：選廠商、按「＋ 新商品建檔」建立商品並勾選顏色尺寸，再填每個顏色尺寸的數量與進貨單價，存檔後庫存就會增加。</li>
    <li>有客人購買時開「<a href="#/sale">銷貨收銀</a>」：輸入貨號或品名，確認數量後按「結帳」。</li>
    <li>每天打開「<a href="#/home">首頁</a>」看今日營業額、低庫存提醒，以及資料安全檢查是否都是綠燈。</li>
  </ol>
</section>

<section class="card help" id="help-sale">
  <h2>銷貨與退貨</h2>
  <ol>
    <li>在搜尋框輸入 SKU、本店貨號或品名後按 <kbd>Enter</kbd>。</li>
    <li>輸入完整 SKU（例如 <kbd>4B7A695A9-BK-M</kbd>）時直接加入一件；重複輸入同一件會自動把數量加 1。</li>
    <li>輸入貨號或品名時，會跳出「顏色 × 尺寸」表格，在要賣的格子填數量後按「加入明細」。</li>
    <li>單價預設為商品的建議售價，可直接修改；整單折扣填在下方。</li>
    <li>按「結帳」會再顯示一次合計確認，確認後才會存檔。</li>
  </ol>
  <h3>客人退貨</h3>
  <p>同樣開一張銷貨單，把該商品的數量改成負數（例如 <kbd>-1</kbd>），存檔後庫存會加回去、金額為負數。</p>
  <h3>庫存不足</h3>
  <p>數量超過庫存時該列會標紅，存檔時系統會擋下並說明哪一個 SKU 不夠。請先確認是否漏登進貨。</p>
</section>

<section class="card help" id="help-purchase">
  <h2>進貨</h2>
  <ol>
    <li>選擇廠商；沒有的話按「＋ 新增廠商」直接建立。</li>
    <li>需要的話按「選擇照片」附上貨單或商品照，方便日後對帳（可不附）。</li>
    <li>輸入貨號或品名找既有商品；新款按「＋ 新商品建檔」，存檔後會直接進入數量表格。</li>
    <li>在「顏色 × 尺寸」表格填各格數量，並填寫這批的進貨單價，按「加入明細」。</li>
    <li>缺少的顏色或尺寸，在表格下方按「加顏色／尺寸」補建 SKU。</li>
    <li>確認明細後按「存檔進貨」。</li>
  </ol>
  <p class="muted">進貨日期可以選過去的日期（補登），系統會自動依日期重新計算成本。</p>
</section>

<section class="card help" id="help-product">
  <h2>商品與 SKU</h2>
  <dl>
    <dt>本店貨號</dt><dd>建檔時自動產生：建檔日期加當日流水號，轉成 16 進位，例如 2026-10-17 第 1 款為 <kbd>4B7A695A9</kbd>。建立後不可修改。</dd>
    <dt>SKU</dt><dd>本店貨號-顏色代碼-尺寸代碼，例如 <kbd>4B7A695A9-BK-M</kbd>。在商品頁勾選顏色與尺寸即可一次產生。</dd>
    <dt>安全庫存</dt><dd>庫存低於這個數字時，首頁與查庫存會以紅字提醒。填 0 表示不提醒。</dd>
  </dl>
  <p>商品與 SKU 只有在從未進出貨時才能刪除；已有單據的商品請保留，以免報表對不起來。</p>
</section>

<section class="card help" id="help-adjust">
  <h2>庫存調整與盤點</h2>
  <ul>
    <li><b>盤點調整</b>：輸入「實際盤點數量」，系統自動算出差異。</li>
    <li><b>瑕疵報廢、退回廠商</b>：輸入減少的件數（填正數即可）。</li>
    <li><b>其他</b>：增加填正數、減少填負數。</li>
  </ul>
  <p>每次調整都必須填寫原因，並保留在單據與操作紀錄中。</p>
</section>

<section class="card help" id="help-docs">
  <h2>單據與作廢</h2>
  <ul>
    <li>進貨單、銷貨單、調整單存檔後<b>不能修改、不能刪除</b>，確保帳目完整可追溯。</li>
    <li>打錯時到「<a href="#/docs">單據查詢</a>」點開該張單據，按「作廢」並填寫原因，再重開一張正確的。</li>
    <li>作廢後庫存與成本會自動重算。若作廢會讓庫存變成負數（例如進貨已經賣掉），系統會拒絕，請先處理相關銷貨單。</li>
    <li>單號規則：進貨 PO、銷貨 SO、調整 AJ，加上日期與當日流水號，例如 <kbd>SO20261019001</kbd>。</li>
  </ul>
</section>

<section class="card help" id="help-report">
  <h2>報表</h2>
  <dl>
    <dt>即時庫存表</dt><dd>每個 SKU 的庫存、平均成本、庫存金額與低庫存警示。</dd>
    <dt>進貨／銷貨報表</dt><dd>選擇日期區間，列出每一筆明細；銷貨報表含成本與毛利。</dd>
    <dt>季度收益</dt><dd>每季的進貨成本、銷貨淨額、銷貨成本、毛利率與庫存週轉率。</dd>
    <dt>滯銷品</dt><dd>指定天數內沒有賣出、但仍有庫存的 SKU。</dd>
    <dt>熱銷排行</dt><dd>區間內銷量前 50 名的商品。</dd>
  </dl>
  <p>每張報表都能「匯出 Excel」（含商品縮圖）。「更新三大報表」會產生包含進貨、銷貨、收益三個工作表的 <kbd>報表/庫存系統報表.xlsx</kbd>；若該檔正以 Excel 開啟，請先關閉再更新。</p>
  <h3>成本怎麼算</h3>
  <p>採<b>移動加權平均</b>：每次進貨後，平均成本 =（原庫存金額 + 本次進貨金額）÷ 新庫存數量。銷貨以當下平均成本計算銷貨成本。補登過去日期的單據時，系統會依日期重算所有受影響的成本。</p>
</section>

<section class="card help" id="help-safe">
  <h2>資料安全與備份</h2>
  <ul>
    <li>所有資料存在首頁「資料位置」顯示的資料夾（安裝版為 <kbd>%LOCALAPPDATA%\服飾庫存系統-資料</kbd>）：<kbd>庫存資料.sqlite3</kbd>（資料庫）、<kbd>圖片</kbd>、<kbd>報表</kbd>、<kbd>備份</kbd>。首頁可按「開啟資料夾」。解除安裝或升級程式不會刪除這些資料。</li>
    <li>每次存檔都以交易方式寫入，存到一半斷電也不會只存一半。</li>
    <li>每天第一次開啟程式時自動備份資料庫到 <kbd>備份</kbd> 資料夾，保留最近 30 天。</li>
    <li>每次啟動都會檢查資料庫檔案；首頁的「庫存帳核對」會比對每個 SKU 的庫存與所有單據加總是否一致。若出現紅燈，按「重新核算」即可依單據重建庫存與成本。</li>
    <li>所有新增、修改、作廢、匯出都記錄在「<a href="#/audit">操作紀錄</a>」，紀錄無法修改或刪除。</li>
  </ul>
  <h3>建議</h3>
  <ul>
    <li>定期把整個資料夾（含 <kbd>圖片</kbd> 與 <kbd>備份</kbd>）複製到隨身碟或雲端硬碟。</li>
    <li>還原備份：先關閉程式，把 <kbd>備份</kbd> 裡想要的日期檔案複製出來，改名為 <kbd>庫存資料.sqlite3</kbd> 取代原檔，再開啟程式。</li>
  </ul>
</section>

<section class="card help" id="help-faq">
  <h2>常見問題</h2>
  <dl>
    <dt>存檔時出現紅色提示？</dt><dd>提示會直接說明原因（例如「庫存不足」、「請填寫進貨單價」），依提示修正後再存檔即可，資料不會被存一半。</dd>
    <dt>單據打錯了怎麼辦？</dt><dd>到單據查詢點開該單，按「作廢」並填原因，再重開一張。</dd>
    <dt>找不到商品？</dt><dd>確認貨號沒有打錯；記不得貨號時可輸入品名的一部分，或到「商品」頁搜尋廠商貨號。</dd>
    <dt>畫面上的資料沒有更新？</dt><dd>切換到其他頁面再回來，或重新點選左側選單即可重新載入。</dd>
    <dt>換電腦怎麼搬資料？</dt><dd>在新電腦安裝程式並開啟一次後關閉，再把舊電腦的整個資料夾內容（從首頁「開啟資料夾」找到）複製到新電腦的相同位置即可。</dd>
  </dl>
</section>
